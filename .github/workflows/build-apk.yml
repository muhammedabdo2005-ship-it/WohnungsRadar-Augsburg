name: Android APK erstellen
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Projekt laden
        uses: actions/checkout@v4
      - name: Java 17 installieren
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK prüfen
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME/cmdline-tools"
          find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f

      - name: Android API 35 installieren
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)
          if [ -z "$SDKMANAGER" ]; then
            echo "FEHLER: sdkmanager nicht gefunden"
            exit 1
          fi
          echo "SDK-Manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Gradle Wrapper mit Pruefsumme einrichten
        run: bash setup-wrapper.sh
      - name: Debug APK erstellen
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: WohnungsRadar-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
