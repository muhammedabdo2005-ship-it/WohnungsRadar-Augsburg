name: Android APK erstellen
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Projekt laden
        uses: actions/checkout@v4
      - name: Java 17 installieren
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK installieren
        uses: android-actions/setup-android@v3

      - name: Android API 35 installieren
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle Wrapper mit Pruefsumme einrichten
        run: bash setup-wrapper.sh
      - name: Debug APK erstellen
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: WohnungsRadar-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
